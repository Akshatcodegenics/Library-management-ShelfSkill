{% extends 'base.html' %}

{% block title %}Browse Books - Library System{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h2 class="fw-bold mb-1"><i class="fa-solid fa-book-open text-primary me-2"></i>Library Catalogue</h2>
        <p class="text-muted mb-0">Search and filter available books across categories and authors.</p>
    </div>
</div>

<!-- Search & Filter Controls -->
<div class="card border-0 shadow-sm rounded-3 mb-4">
    <div class="card-body p-3 bg-white">
        <form id="filter-form" class="row g-3">
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" class="form-control" id="search-input" placeholder="Search title, ISBN, category...">
                </div>
            </div>
            <div class="col-md-3">
                <select class="form-select" id="category-filter">
                    <option value="">All Categories</option>
                    <option value="Programming">Programming</option>
                    <option value="Software Engineering">Software Engineering</option>
                    <option value="Fiction">Fiction</option>
                    <option value="General">General</option>
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-select" id="availability-filter">
                    <option value="">All Inventory</option>
                    <option value="true">Available Copies Only</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100 fw-bold">Filter</button>
            </div>
        </form>
    </div>
</div>

<!-- Book Cards Container -->
<div class="row g-4" id="books-cards-container">
    <div class="col-12 text-center py-5 text-muted">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Loading catalogue...</p>
    </div>
</div>

<!-- Pagination -->
<div class="d-flex justify-content-between align-items-center mt-4" id="pagination-controls">
    <button class="btn btn-outline-secondary btn-sm" id="prev-page-btn" disabled>Previous</button>
    <span class="text-muted small" id="pagination-info">Page 1</span>
    <button class="btn btn-outline-secondary btn-sm" id="next-page-btn" disabled>Next</button>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/member.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    requireRole('MEMBER');
    initBrowseBooks();
});
</script>
{% endblock %}
