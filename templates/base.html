<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Library Management System{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body style="background-color:#ffffff;">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background:linear-gradient(90deg,#0a58ca,#0d6efd);">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="/">
                <i class="fa-solid fa-book-open-reader me-2 fs-4 text-white"></i>
                <span>ShelfSkill</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Dynamic Navigation links populated via JS -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="nav-links">
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <a href="/api/docs/" target="_blank" class="btn btn-outline-warning btn-sm">
                        <i class="fa-solid fa-code me-1"></i> Swagger API
                    </a>
                    <div id="user-profile-widget" class="d-none text-light d-flex align-items-center gap-2">
                        <span class="badge bg-primary me-1" id="user-role-badge">Member</span>
                        <span class="fw-semibold text-truncate" style="max-width: 150px;" id="user-display-name">User</span>
                        <button class="btn btn-outline-danger btn-sm ms-2" onclick="logoutUser()">
                            <i class="fa-solid fa-right-from-bracket"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container-fluid px-4 py-4 min-vh-100">
        <!-- Toast Notification Container -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
            <div id="app-toast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body" id="toast-message"></div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-3 text-center text-muted">
        <div class="container">
            <small>&copy; 2026 Library Management System. Powered by Django, Django REST Framework & Bootstrap 5.</small>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/auth.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
