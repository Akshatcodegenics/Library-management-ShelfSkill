<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — ShelfSkill Control Panel</title>
  {% load static %}
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/admin_panel.css' %}">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      background: #0b1329;
      color: #1e293b;
    }

    /* Fullscreen Video Background */
    .video-bg-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .video-bg-container video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Blue Gradient Dark Overlay */
    .video-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(11, 19, 41, 0.88) 0%,
        rgba(30, 58, 138, 0.82) 50%,
        rgba(15, 23, 42, 0.94) 100%
      );
      z-index: 1;
      backdrop-filter: blur(4px);
    }

    /* Content Wrapper */
    .auth-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      padding: 24px 16px;
    }

    /* Centered White Card */
    .admin-card {
      background: #ffffff;
      border-radius: 1.25rem;
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 2.25rem 2rem;
    }

    .shield-icon-badge {
      width: 62px;
      height: 62px;
      background: rgba(37, 99, 235, 0.1);
      color: #2563eb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 1.7rem;
    }

    .form-label {
      font-size: 0.875rem;
      color: #475569;
    }

    .input-group-text {
      background-color: #f8fafc;
      border-color: #cbd5e1;
      color: #64748b;
    }

    .form-control {
      padding: 0.7rem 0.9rem;
      border-color: #cbd5e1;
      font-size: 0.925rem;
    }

    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.15);
    }

    .btn-primary {
      background-color: #2563eb;
      border-color: #2563eb;
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
      border-color: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px -2px rgba(37, 99, 235, 0.35);
    }

    .seed-info-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 0.75rem;
    }

    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      transition: color 0.2s, transform 0.2s;
    }

    .back-home-link:hover {
      color: #ffffff;
      transform: translateX(-2px);
    }
  </style>
</head>
<body>

  <!-- Fullscreen Video Background -->
  <div class="video-bg-container">
    <video autoplay muted loop playsinline id="hero-video">
      <source src="/static/videos/library_hero.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Blue Gradient Dark Overlay -->
  <div class="video-overlay"></div>

  <!-- Main Auth Container -->
  <div class="auth-wrapper">
    <div class="admin-card">
      
      <!-- Card Header -->
      <div class="text-center mb-4">
        <div class="shield-icon-badge mx-auto mb-3">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h4 class="fw-bold mb-1 text-slate-800">Admin Control Panel</h4>
        <p class="text-muted small mb-0">Authorized personnel only</p>
      </div>

      <!-- Error Alert Div -->
      <div id="admin-login-alert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

      <!-- Admin Login Form -->
      <form id="admin-login-form">
        <div class="mb-3">
          <label for="ad-username" class="form-label fw-semibold">Username or Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
            <input type="text" class="form-control" id="ad-username" placeholder="admin@example.com" required autocomplete="username">
          </div>
        </div>

        <div class="mb-4">
          <label for="ad-password" class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" id="ad-password" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="ad-login-btn" class="btn btn-primary rounded-pill w-100 fw-bold shadow-sm">
          <span id="ad-login-spinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
          Sign In
        </button>
      </form>

      <hr class="my-4 text-muted opacity-25">

      <div class="text-center">
        <p class="text-muted small mb-2">Need an Admin Account?</p>
        <a href="/admin/create-account/" class="btn btn-outline-primary btn-sm rounded-pill w-100">
          <i class="fa-solid fa-key me-1"></i> Create Admin Account
        </a>
      </div>

      <!-- Seed Admin Account Info with One-Click Fill -->
      <div class="mt-3 p-3 seed-info-box text-center">
        <small class="d-block fw-bold text-primary mb-2">
          <i class="fa-solid fa-circle-info me-1"></i>Demo Admin Credentials
        </small>
        <div class="d-flex justify-content-center gap-3 mb-2" style="font-size:0.82rem;">
          <span class="text-secondary">Username: <code class="text-primary fw-bold">admin</code></span>
          <span class="text-secondary">Password: <code class="text-primary fw-bold">admin123</code></span>
        </div>
        <button type="button" onclick="fillDemo()" class="btn btn-primary btn-sm rounded-pill px-4 fw-bold">
          <i class="fa-solid fa-bolt me-1"></i>Auto-Fill &amp; Login
        </button>
      </div>

    </div>

    <!-- Back to Landing Page Link -->
    <div class="text-center mt-3">
      <a href="/" class="back-home-link">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
      </a>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
    <div id="admin-toast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="admin-toast-msg"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>

  <!-- Login Logic Script -->
  <script>
    function showAdminToast(message, type = 'info') {
      const toastEl = document.getElementById('admin-toast');
      const toastBody = document.getElementById('admin-toast-msg');
      if (!toastEl || !toastBody) return;
      toastEl.className = `toast align-items-center text-white border-0 bg-${type === 'error' ? 'danger' : (type === 'success' ? 'success' : 'primary')}`;
      toastBody.innerHTML = message;
      new bootstrap.Toast(toastEl, { delay: 3500 }).show();
    }

    // One-click demo fill + auto-submit
    function fillDemo() {
      document.getElementById('ad-username').value = 'admin';
      document.getElementById('ad-password').value = 'admin123';
      // Flash the fields
      ['ad-username','ad-password'].forEach(id => {
        const el = document.getElementById(id);
        el.style.borderColor = '#0d6efd';
        el.style.background  = '#e7f1ff';
        setTimeout(() => { el.style.borderColor=''; el.style.background=''; }, 600);
      });
      // Auto-submit after brief pause
      setTimeout(() => {
        document.getElementById('ad-login-btn').click();
      }, 400);
    }


    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in as Admin, redirect to dashboard
      const token = localStorage.getItem('access_token');
      const userRole = localStorage.getItem('user_role');
      if (token && (userRole === 'ADMIN' || userRole === 'AUTHOR')) {
        window.location.href = '/admin/dashboard/';
        return;
      }

      const form = document.getElementById('admin-login-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('ad-username').value.trim();
        const password = document.getElementById('ad-password').value;

        const alertBox = document.getElementById('admin-login-alert');
        const spinner = document.getElementById('ad-login-spinner');
        const btn = document.getElementById('ad-login-btn');

        alertBox.classList.add('d-none');
        spinner.classList.remove('d-none');
        btn.disabled = true;

        try {
          const res = await fetch('/api/auth/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();

          if (res.ok && data.success) {
            const user = data.data.user;
            // Allow: ADMIN role, AUTHOR role, is_admin flag, is_staff, or is_superuser
            const isAdmin = user.is_admin || user.is_staff || user.is_superuser ||
                            user.role === 'ADMIN' || user.role === 'AUTHOR';
            if (!isAdmin) {
              alertBox.textContent = 'Access Denied. This account does not have admin privileges.';
              alertBox.classList.remove('d-none');
              return;
            }

            localStorage.setItem('access_token', data.data.access);
            localStorage.setItem('refresh_token', data.data.refresh);
            localStorage.setItem('user_role', user.role);
            localStorage.setItem('user_name', user.name || user.username);
            localStorage.setItem('user_email', user.email);
            localStorage.setItem('user_id', user.id);

            showAdminToast('Admin authentication granted.', 'success');
            setTimeout(() => { window.location.href = '/admin/dashboard/'; }, 500);
          } else {
            alertBox.textContent = data.message || 'Invalid admin credentials.';
            alertBox.classList.remove('d-none');
          }
        } catch (err) {
          console.error('Login Fetch Error:', err);
          alertBox.textContent = 'Server communication error: ' + err.message;
          alertBox.classList.remove('d-none');
        } finally {
          spinner.classList.add('d-none');
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
