{% extends 'admin/base_admin.html' %}

{% block title %}Reports & Analytics - Admin Panel{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h3 class="fw-bold mb-1 text-slate-800"><i class="fa-solid fa-chart-line text-primary me-2"></i>Analytics & Reporting</h3>
        <p class="text-muted mb-0">System performance analytics and library usage metrics.</p>
    </div>
</div>

<div class="row g-4 mb-4">
    <div class="col-md-7">
        <div class="card admin-card p-4 h-100">
            <h5 class="fw-bold mb-4 text-center">System Overview</h5>
            <div style="position: relative; height:300px; width:100%;">
                <canvas id="overviewChart"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-5">
        <div class="card admin-card p-4 h-100">
            <h5 class="fw-bold mb-4 text-center">Active Loan Distribution</h5>
            <div style="position: relative; height:300px; width:100%; display:flex; justify-content:center;">
                <canvas id="loanChart"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Include Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    requireAdminRole();
    const el = document.getElementById('nav-admin-reports');
    if (el) el.classList.add('active');

    try {
        const res = await fetchAdminApi('/api/dashboard/');
        const data = await res.json();
        if (res.ok && data.success) {
            const stats = data.data;
            renderCharts(stats);
        } else {
            showAdminToast('Failed to load analytics data.', 'error');
        }
    } catch (e) {
        console.error(e);
        showAdminToast('Server error while loading analytics.', 'error');
    }
});

function renderCharts(stats) {
    // Bar Chart for System Overview
    const ctxOverview = document.getElementById('overviewChart').getContext('2d');
    new Chart(ctxOverview, {
        type: 'bar',
        data: {
            labels: ['Total Books (Titles)', 'Active Users', 'Total Loans'],
            datasets: [{
                label: 'System Metrics',
                data: [stats.total_books, stats.active_users, stats.borrowed_books],
                backgroundColor: [
                    'rgba(13, 110, 253, 0.7)',
                    'rgba(25, 135, 84, 0.7)',
                    'rgba(13, 202, 240, 0.7)'
                ],
                borderColor: [
                    '#0d6efd',
                    '#198754',
                    '#0dcaf0'
                ],
                borderWidth: 1,
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true, ticks: { precision: 0 } }
            }
        }
    });

    // Doughnut Chart for Loan Status
    const ctxLoan = document.getElementById('loanChart').getContext('2d');
    const onTimeLoans = Math.max(0, stats.borrowed_books - stats.overdue_books);
    
    new Chart(ctxLoan, {
        type: 'doughnut',
        data: {
            labels: ['On-Time Loans', 'Overdue Loans'],
            datasets: [{
                data: [onTimeLoans, stats.overdue_books],
                backgroundColor: [
                    'rgba(25, 135, 84, 0.8)', // Green
                    'rgba(220, 53, 69, 0.8)'  // Red
                ],
                hoverOffset: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '65%',
            plugins: {
                legend: { position: 'bottom' }
            }
        }
    });
}
</script>
{% endblock %}
